name: Build data and deploy site

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-download all source data (otherwise reuse the cached copy)"
        type: boolean
        default: true
  schedule:
    - cron: "23 7 4 * *" # 07:23 UTC on the 4th of every month
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pipeline/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached source data
        run: |
          mkdir -p cache
          if git fetch --depth=1 origin data-cache 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C cache
            echo "Restored cache:"; ls -R cache | head -40
          else
            echo "No data-cache branch yet"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Download source data
        id: fetch
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.refresh) ||
          hashFiles('cache/manifest.json') == '' ||
          contains(github.event.head_commit.message, '[refresh]')
        run: python pipeline/fetch.py

      - name: Save source data to the data-cache branch
        if: steps.fetch.outcome == 'success'
        run: |
          rm -rf /tmp/cache-push && cp -r cache /tmp/cache-push && cd /tmp/cache-push
          rm -rf .git
          git init -q -b data-cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Source data cache $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-cache

      - uses: actions/setup-node@v4
        if: hashFiles('pipeline/build.py') != ''
        with:
          node-version: "20"

      - name: Build site data
        if: hashFiles('pipeline/build.py') != ''
        run: |
          npm install -g mapshaper@0.6
          python pipeline/build.py

      - name: Smoke test in a headless browser
        if: hashFiles('pipeline/build.py') != ''
        continue-on-error: true
        run: |
          mkdir -p /tmp/qa-tool && cd /tmp/qa-tool
          npm init -y >/dev/null && npm install --silent playwright@1.56.0
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/scripts/qa.mjs" .
          node qa.mjs "$GITHUB_WORKSPACE/site" /tmp/qa-out
          cd /tmp/qa-out
          git init -q -b qa-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "QA screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" qa-results

      - name: Deploy to gh-pages
        if: hashFiles('pipeline/build.py') != ''
        run: |
          rm -rf /tmp/site && cp -r site /tmp/site && cd /tmp/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy site from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
