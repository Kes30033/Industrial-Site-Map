name: Check data sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe.py
      - scripts/probe_urls.txt
      - scripts/probe_extra.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source URLs
        run: python3 scripts/probe.py 2>&1 | tee probe_out_log.txt || true
      - name: Extra checks
        run: python3 scripts/probe_extra.py 2>&1 | tee -a probe_out_log.txt || true
      - name: Save results to the probe-results branch
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r probe_out/. /tmp/res/ 2>/dev/null || true
          cp probe_out_log.txt /tmp/res/ 2>/dev/null || true
          cd /tmp/res
          git init -q -b probe-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Probe results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" probe-results
